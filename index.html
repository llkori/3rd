<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A little something for you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ---------- BASE & LAYERS ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:linear-gradient(180deg,#fffaf8 0%,#f7edf3 38%,#f3eae2 100%);touch-action:manipulation;overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;overflow:hidden;background:linear-gradient(180deg,#fffaf7 0%,#f9edf3 30%,#f5e7df 100%)}
.layer{position:absolute;inset:0;pointer-events:none}
#bg{z-index:1;opacity:0;transition:opacity 1.8s ease;
  background:
    radial-gradient(circle at 50% 16%, rgba(255,255,255,.42), transparent 25%),
    radial-gradient(ellipse at 28% 20%, rgba(255,192,209,.26), transparent 28%),
    radial-gradient(ellipse at 72% 18%, rgba(197,177,255,.18), transparent 30%),
    radial-gradient(circle, rgba(255,255,255,.04) 1.2px, transparent 1.6px) 0 0/9px 9px,
    linear-gradient(180deg, #f8dfe8 0%, #f1d8df 24%, #efd9d2 46%, #e9d9ea 100%);
}
#bg.on{opacity:1}
#botany{z-index:2;opacity:0;transition:opacity 2.2s ease}
#botany.on{opacity:1}
#botany svg{width:100%;height:100%;filter:saturate(1.2) drop-shadow(0 22px 26px rgba(123,81,88,.08));opacity:.9}
#wall{z-index:3;opacity:1;filter:saturate(1.15) contrast(1.05);will-change:transform,opacity,filter;transition:filter 1.2s ease,opacity 1.5s ease .3s,transform 1.1s ease}
#wall.out{filter:blur(5px) saturate(.22) brightness(.64) contrast(.92);opacity:0;transform:scale(1.12)}

/* ---------- FLOWERS: explosive bloom, small cluster -> huge wall ---------- */
.f{position:absolute;opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--start,0.12));will-change:transform,opacity}
.f.in{animation:pop var(--dur,.32s) cubic-bezier(.12,1.25,.22,1) var(--dl,0s) both}
@keyframes pop{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--r0)) scale(var(--start,0.12))}
  18%{opacity:1}
  64%{opacity:var(--o);transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--pk,1.15))}
  100%{opacity:var(--o);transform:translate(-50%,-50%) rotate(var(--r)) scale(1)}
}
.f img{width:100%;height:100%;display:block;object-fit:contain;user-select:none;-webkit-user-drag:none;filter:drop-shadow(0 10px 12px rgba(0,0,0,.12))}

/* ---------- BOUQUET ---------- */

/* ---------- POSTCARD ---------- */
.card{z-index:5;position:absolute;left:50%;top:52%;width:min(660px,92vw);opacity:0;transform:translate(-50%,-50%) translateY(150px) rotate(9deg) scale(.92);filter:drop-shadow(0 28px 36px rgba(0,0,0,.32));transition:transform 1.5s cubic-bezier(.25,1.3,.35,1),opacity .7s ease}
.card.on{opacity:1;animation:cardSettle 1.15s cubic-bezier(.18,1,.2,1) both}
@keyframes cardSettle{
  0%{transform:translate(-50%,-50%) translateY(120px) rotate(14deg) scale(.88)}
  55%{transform:translate(-50%,-50%) translateY(-6px) rotate(-4deg) scale(1.02)}
  100%{transform:translate(-50%,-50%) translateY(0) rotate(-1.5deg) scale(1)}
}
.paper{position:relative;color:#4a4238;padding:clamp(28px,6vw,42px) clamp(26px,5.8vw,38px) clamp(22px,5vw,34px);border:1px solid rgba(115,89,69,.12);background:radial-gradient(circle at 18% 18%,rgba(255,255,255,.55),transparent 35%),radial-gradient(circle at 88% 92%,rgba(206,176,104,.12),transparent 42%),radial-gradient(circle,rgba(140,110,75,.07) 1px,transparent 1.3px) 0 0/5px 5px,#f7f1df;box-shadow:inset 0 0 0 1px rgba(109,82,60,.05),inset -8px -8px 18px rgba(116,86,57,.04);overflow:hidden}
.paper::before{content:"";position:absolute;inset:10px;border:1px solid rgba(154,118,95,.18);pointer-events:none}
.paper::after{content:"";position:absolute;top:-1px;right:-1px;width:78px;height:78px;background:linear-gradient(135deg,rgba(255,255,255,.88) 0%,rgba(242,228,192,.86) 25%,rgba(210,180,116,.78) 100%);clip-path:polygon(0 0,100% 0,100% 100%);box-shadow:-10px 10px 18px rgba(90,64,38,.08);transform:translate(18px,-18px);border-left:1px solid rgba(109,82,60,.12);border-bottom:1px solid rgba(109,82,60,.08)}
.letter-image{display:block;width:100%;height:auto;max-height:72vh;object-fit:contain;filter:drop-shadow(0 8px 18px rgba(96,72,52,.08));border-radius:2px}
.card.on .paper{animation:paperSlip .9s cubic-bezier(.18,.9,.2,1) both}
@keyframes paperSlip{
  0%{transform:translateY(34px) rotate(-6deg) scale(.96);opacity:0}
  55%{opacity:1}
  100%{transform:translateY(0) rotate(0) scale(1);opacity:1}
}
.greet{font:500 clamp(36px,8vw,52px)/1.1 'Caveat',cursive;color:#5b3f4b;padding-right:clamp(60px,18vw,110px);margin-bottom:.55em}
.msg{font:400 clamp(17px,3.5vw,24px)/1.7 'Cormorant Garamond',Georgia,serif;font-weight:500}
.ln{min-height:1.8em}
.sign{font:400 clamp(28px,6vw,38px)/1.2 'Caveat',cursive;color:#5b3f4b;text-align:right;margin-top:.8em}

.side-figure{position:absolute;bottom:18%;z-index:4;pointer-events:none;filter:drop-shadow(0 14px 18px rgba(0,0,0,.15));opacity:0;transition:opacity .8s ease,transform .8s ease}
.side-figure.on{opacity:1}
#fig-left{left:clamp(18px,6vw,120px);transform:translateX(-10px) scale(.9) rotate(-2deg)}
#fig-right{right:clamp(18px,6vw,120px);transform:translateX(10px) scale(.9) rotate(2deg)}
#fig-left.on{transform:translateX(0) scale(1) rotate(0)}
#fig-right.on{transform:translateX(0) scale(1) rotate(0)}
.side-figure img{display:block;width:clamp(100px,16vw,190px);height:auto;user-select:none;-webkit-user-drag:none;transform-origin:50% 100%;animation:figSway 5.5s ease-in-out infinite alternate}
#fig-right img{animation-delay:-2.2s}
.confetti-cluster{position:absolute;left:50%;top:12%;width:180px;height:180px;pointer-events:none;z-index:5;opacity:0;transform:translateX(-50%) scale(.75);transition:opacity .8s ease,transform .8s ease}
.confetti-cluster.on{opacity:1;transform:translateX(-50%) scale(1)}
.confetti-cluster.side{width:120px;height:120px;top:15%}
#confetti-left-top{left:28%}
#confetti-right-top{left:72%}
.confetti-piece{position:absolute;left:50%;top:50%;width:var(--size);height:calc(var(--size) * 1.5);background:var(--color);border-radius:2px;opacity:0;box-shadow:0 0 10px rgba(255,255,255,.28);transform:translate(-50%,-50%) rotate(var(--rot));animation:burstOut 1.9s cubic-bezier(.18,.8,.2,1) forwards var(--delay)}
@keyframes burstOut{
  0%{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.4)}
  12%{opacity:1}
  100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(calc(var(--rot) + 180deg)) scale(1)}
}
@keyframes figSway{0%{transform:rotate(-1.6deg) translateY(0)}100%{transform:rotate(1.6deg) translateY(-6px)}}
@media (max-width:700px){.side-figure{bottom:2.5vh}#fig-left{left:6px}#fig-right{right:6px}.side-figure img{width:clamp(84px,25vw,120px)}.confetti-cluster{width:130px;height:130px}.confetti-cluster.side{width:95px;height:95px}#confetti-left-top{left:22%}#confetti-right-top{left:78%}}
.ln,.sign,.greet{opacity:0}
.write .greet,.write .ln,.write .sign{animation:letterRise .9s cubic-bezier(.22,1,.36,1) var(--d,0s) both}
@keyframes letterRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#stamp{position:absolute;top:clamp(18px,4vw,26px);right:clamp(18px,4vw,26px);width:clamp(52px,14vw,66px);opacity:0;transform:rotate(4deg) scale(.7);transition:opacity .6s ease .8s,transform .8s cubic-bezier(.34,1.4,.5,1) .8s}
.card.on #stamp{opacity:1;transform:rotate(4deg) scale(1)}
#clip{position:absolute;z-index:2;top:-16px;left:13%;width:clamp(20px,5vw,26px);opacity:0;transform:translateY(-26px) rotate(-22deg);transition:opacity .4s ease 1s,transform .9s cubic-bezier(.34,1.5,.5,1) 1s}
.card.on #clip{opacity:1;transform:rotate(-4deg)}

@media (prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important}
  .greet,.ln,.sign{opacity:1!important;transform:none!important}
  #wall{display:none}
}
</style>
</head>

<script>
/* =====================================================
   CONFIG — the only thing you need to edit
   ===================================================== */
const CONFIG = {
  name: "Emma",
  message: `I saw you loved digital flowers,
so I wanted to make sure
you got some of your own.`,
  sender: "Alex"
};

/* =====================================================
   HELPERS
   ===================================================== */
const $ = id => document.getElementById(id);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.min(b, Math.max(a, v));

// Restrained pastel palettes (edit freely)
const PAL = {
  rose:   [['#f2b8bf','#f6cdb6','#e59aa6'], ['#f8ecd8','#f0b6bd','#e8a0aa'], ['#f4c7b4','#f9dcc8','#e3a48f'], ['#e9a7b3','#f3c4c7','#d98b9b']],
  hydr:   [['#a9b8e6','#c9c2ec'], ['#b9c9ea','#9db0dc'], ['#d6b9dc','#b9b4e6'], ['#f0bdd0','#d9b8e4']],
  iris:   [['#b5a8e2','#8f9fd8'], ['#c6b2e4','#a3a5df']],
  wild:   ['#f7d9a0','#f4b7c1','#c9c2ec','#b2c8ea','#fbeedd'],
  leaf:   ['#9db596','#89a58a','#a9be9c','#7f9d84']
};

/* =====================================================
   FLOWER ARTWORK — inline SVG, viewBox -50 -50 100 100
   Layered, semi-transparent, slightly jittered = gouache feel
   ===================================================== */
// n petals (ellipses) around the centre; jit adds imperfection
function petals(n, rx, ry, d, fill, op, rot = 0, jit = 2) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = (360 / n) * i + rot + rnd(-jit, jit), k = rnd(.9, 1.1);
    s += `<ellipse cx="0" cy="${-d}" rx="${rx * k}" ry="${ry * rnd(.92, 1.08)}" transform="rotate(${a})" fill="${fill}" opacity="${op * rnd(.85, 1)}"/>`;
  }
  return s;
}
const dot = (x, y, r, f, o = 1) => `<circle cx="${x}" cy="${y}" r="${r}" fill="${f}" opacity="${o}"/>`;

function createRose() {
  const [a, b, c] = pick(PAL.rose);
  return petals(6, 15, 14, 14, a, .75, rnd(0, 60), 8) + petals(5, 12, 11, 9, b, .82, 20, 8) +
    petals(4, 8, 8, 5, a, .85, 45, 10) + dot(0, 0, 6, c, .8) +
    `<path d="M-5 0 C-5 -6 5 -6 5 0 C5 5 -2 5 -2 1" fill="none" stroke="#fff" stroke-width="1.2" opacity=".5"/>` +
    `<ellipse cx="-9" cy="-14" rx="6" ry="3" fill="#fff" opacity=".22" transform="rotate(-30 -9 -14)"/>`;
}
function createDaisy() {
  return petals(13, 6.5, 17, 20, '#fffdf6', .88, 0, 5) + petals(13, 4.5, 12, 17, '#efe6d2', .5, 14, 4) +
    dot(0, 0, 8, '#f0c96a') + dot(-2, -2, 4.5, '#f7dc94', .8) + dot(2, 2, 2, '#d9a94c', .6);
}
function createHydrangea() {
  const [a, b] = pick(PAL.hydr);
  let s = '';
  for (let i = 0; i < 17; i++) {
    const ang = rnd(0, 6.28), r = 33 * Math.sqrt(Math.random()), x = Math.cos(ang) * r, y = Math.sin(ang) * r;
    s += `<g transform="translate(${x} ${y}) scale(${rnd(.45, .7)})">${petals(4, 9, 9, 7, i % 2 ? a : b, .78, rnd(0, 90), 6)}${dot(0, 0, 2.2, '#f6efe0', .8)}</g>`;
  }
  return s;
}
function createIris() {
  const [a, b] = pick(PAL.iris);
  return petals(3, 11, 22, 15, a, .8, 180, 6) + petals(3, 8, 19, 11, b, .85, 60, 6) +
    `<ellipse cx="0" cy="0" rx="3" ry="11" fill="#f5d98a" opacity=".85"/>` + dot(0, 0, 3, '#e6bb5c');
}
function createSunflower() {
  let d = '';
  for (let i = 0; i < 22; i++) d += dot(rnd(-9, 9), rnd(-9, 9), rnd(.8, 1.6), '#a67c52', .7);
  return petals(18, 5, 16, 24, '#f0cf6f', .9, 0, 4) + petals(18, 4.5, 13, 19, '#e5bd58', .7, 10, 4) +
    dot(0, 0, 13, '#7a5638', .95) + dot(0, 0, 8, '#5f412b', .6) + d;
}
function createWildflower() {
  return petals(5, 9, 10, 11, pick(PAL.wild), .82, rnd(0, 70), 6) + dot(0, 0, 4.5, '#f7e3a4') + dot(-1, -1, 1.8, '#fff', .6);
}
function createFillerFlower() {
  const c = pick(PAL.wild);
  let s = '';
  for (let i = 0; i < 7; i++) s += dot(rnd(-16, 16), rnd(-16, 16), rnd(3.5, 6), c, .78) + dot(rnd(-16, 16), rnd(-16, 16), 1.6, '#fff', .55);
  return s;
}
function createLeaf() {
  const g = pick(PAL.leaf);
  return `<path d="M0 -42 C20 -24 20 14 0 44 C-20 14 -20 -24 0 -42Z" fill="${g}" opacity=".8"/>
   <path d="M0 -42 C9 -24 9 14 0 44 C-3 14 -3 -24 0 -42Z" fill="#fff" opacity=".12"/>
   <path d="M0 -36 L0 40" stroke="#5f7d65" stroke-width="1" opacity=".5"/>`;
}
const FLOWERS = { rose: createRose, daisy: createDaisy, hydrangea: createHydrangea, iris: createIris,
  sunflower: createSunflower, wild: createWildflower, filler: createFillerFlower, leaf: createLeaf };
// weighted mix for the wall
const MIX = [['rose',.22],['daisy',.16],['hydrangea',.12],['iris',.1],['sunflower',.08],['wild',.12],['filler',.08],['leaf',.12]];
function createFlower(type) {
  if (!type) { let r = Math.random(); for (const [t, w] of MIX) { if ((r -= w) <= 0) { type = t; break; } } type = type || 'rose'; }
  return `<svg viewBox="-50 -50 100 100" aria-hidden="true">${FLOWERS[type]()}</svg>`;
}
const WALL_IMGS = [
  'f1.jpg.png',
  'f2.jpg.png',
  'f3.jpg.png',
  'f4.jpg.png',
  'f5.jpg.png',
  'f6.jpg.png',
  'f7.jpg.png'
];
// pick weights per image: pansy, gerbera, daisy, red carnation, pink carnation, orange lily, blue lily
const WALL_W = [.15,.16,.18,.10,.15,.13,.13];
function createWallFlower() {
  let r = Math.random(), i = 0;
  for (; i < WALL_W.length - 1; i++) { if ((r -= WALL_W[i]) <= 0) break; }
  return `<img src="${WALL_IMGS[i]}" alt="" draggable="false">`;
}
const flowerG = (type, x, y, s, rot = 0) => `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">${FLOWERS[type]()}</g>`;

/* =====================================================
   BOUQUET & POSTCARD & BOTANICAL BACKDROP
   ===================================================== */
function createPostcard() {
  const clip = `<svg id="clip" viewBox="0 0 26 64" aria-hidden="true"><defs><linearGradient id="br" x1="0" x2="1"><stop offset="0" stop-color="#8a6a2c"/><stop offset=".45" stop-color="#e2c274"/><stop offset="1" stop-color="#9c7a34"/></linearGradient></defs>
    <path d="M6 44 V14 a7 7 0 0 1 14 0 V50 a10 10 0 0 1 -20 0 V22" fill="none" stroke="url(#br)" stroke-width="2.6" stroke-linecap="round"/></svg>`;
  $('card').innerHTML = `${clip}<div class="paper"><img class="letter-image" src="lt1.png" alt="Love letter" /></div>`;
}
function escapeHTML(s) { return String(s).replace(/[&<>\"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function createCelebrationBurst(containerId, {count = 18, spread = 120, peak = 0.14, palette = ['#f2b8bf','#f7d9a0','#b7c5e5','#a8d4b5','#d6b9dc','#f9d77b','#e7a7a7','#ff9eb3']} = {}) {
  const wrap = $(containerId);
  if (!wrap) return;
  wrap.innerHTML = Array.from({ length: count }, (_, i) => {
    const angle = (Math.PI * 2 * i) / count + rnd(-.3, .3);
    const radius = rnd(spread * .32, spread);
    const x = Math.cos(angle) * radius;
    const y = Math.sin(angle) * radius;
    const size = rnd(7, 14);
    const color = pick(palette);
    const delay = `${(i * 0.04).toFixed(2)}s`;
    return `<span class="confetti-piece" style="--size:${size}px;--color:${color};--x:${x.toFixed(2)}px;--y:${y.toFixed(2)}px;--rot:${rnd(-180, 180)}deg;--delay:${delay};"></span>`;
  }).join('');
  wrap.classList.remove('on');
  void wrap.offsetWidth;
  wrap.classList.add('on');
}
// Faint engraved vines, leaves and a sun-ray motif
function createBotany() {
  const q = (p0, p1, p2, t) => [0, 1].map(i => (1-t)*(1-t)*p0[i] + 2*(1-t)*t*p1[i] + t*t*p2[i]);
  const leaf = (x, y, r, s) => `<path transform="translate(${x} ${y}) rotate(${r}) scale(${s})" d="M0 0 C14 -14 14 -44 0 -60 C-14 -44 -14 -14 0 0 M0 0 L0 -52"/>`;
  let g = '';
  const vines = [[[-20,1020],[150,700],[60,380]], [[1020,1020],[840,760],[930,420]], [[380,1030],[300,930],[120,960]], [[620,1030],[720,950],[880,980]]];
  vines.forEach((v, vi) => {
    g += `<path d="M${v[0]} Q${v[1]} ${v[2]}"/>`;
    for (let i = 1; i < 11; i++) {
      const t = i / 11, [x, y] = q(v[0], v[1], v[2], t), side = i % 2 ? 1 : -1;
      g += leaf(x, y, side * (55 + i * 4) + (vi % 2 ? 20 : -20), .7 + (i % 3) * .2);
    }
    g += `<path d="M${v[2]} q20 -20 6 -36 q-14 -12 -22 2"/>`; // curl at the tip
  });
  g += leaf(90, 120, 40, .9) + leaf(130, 170, 70, .6) + leaf(60, 210, 20, .7);
  let sun = `<circle cx="780" cy="190" r="56"/><circle cx="780" cy="190" r="70" stroke-dasharray="2 6"/>`;
  for (let i = 0; i < 28; i++) {
    const a = i / 28 * 6.283, r1 = 88, r2 = i % 2 ? 128 : 160;
    sun += `<path d="M${780 + Math.cos(a) * r1} ${190 + Math.sin(a) * r1} L${780 + Math.cos(a) * r2} ${190 + Math.sin(a) * r2}"/>`;
  }
  $('botany').innerHTML = `<svg viewBox="0 0 1000 1000" preserveAspectRatio="xMidYMid slice" fill="none" stroke="#c99aa9" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
    <g opacity=".24">${g}</g><g opacity=".18" stroke="#d7bfd1">${sun}</g></svg>`;
}

/* =====================================================
   STAGE 1 — BLOOM (tiny centre cluster -> concentric rings rippling outward -> full wall)
   ===================================================== */
const wall = $('wall');
let positions = [], spawned = 0, total = 0, maxR = 0;
// The bloom should hit hard and fast, then let the scene breathe before the letter appears.
const BLOOM_CURVE = [[0,0],[.08,0],[.2,.06],[.45,.32],[.68,.78],[.88,.96],[1.08,1]];
const BLOOM_END = 1.1;
const bloomFraction = t => {
  for (let i = 1; i < BLOOM_CURVE.length; i++) {
    const [t1, f1] = BLOOM_CURVE[i-1], [t2, f2] = BLOOM_CURVE[i];
    if (t <= t2) return f1 + (f2 - f1) * clamp((t - t1) / (t2 - t1), 0, 1);
  }
  return 1;
};

function planFlowers() {
  const w = innerWidth, h = innerHeight;
  maxR = Math.hypot(w, h) / 2 * 1.12;
  const k = clamp(Math.min(w, h) / 700, .8, 1.3);
  total = clamp(Math.round(w * h / 2100), 260, 360);
  positions = [];
  for (let i = 0; i < total; i++) {
    const cluster = i < 7, tier = Math.random();
    const ang = cluster ? (i / 7) * 6.28 + rnd(-.4, .4) : rnd(0, 6.283);
    const r = cluster ? rnd(8, 34) : maxR * Math.pow(Math.random(), .54);
    const size = cluster ? rnd(52, 74) : (tier < .25 ? rnd(170, 240) : tier < .7 ? rnd(110, 165) : rnd(58, 96)) * k;
    positions.push({ x: Math.cos(ang) * r, y: Math.sin(ang) * r, r, size, cluster });
  }
  // Sorted cleanly by distance from centre (tight jitter only) so the wall grows outward
  // as a genuine expanding circle rather than a random scatter.
  positions.sort((a, b) => (a.cluster ? -1 : 0) - (b.cluster ? -1 : 0) || (a.r + rnd(-12, 12)) - (b.r + rnd(-12, 12)));
}

// How much of the pop's start is offset by radius — this is what makes each ring of
// flowers visibly ripple outward from the centre, even when several are appended at once.
const RIPPLE_SPAN = .42;

function spawnFlower(i) {
  const p = positions[i], el = document.createElement('div');
  el.className = 'f';
  const r = rnd(-40, 40);
  const dur = rnd(.22, .32), pk = p.cluster ? rnd(1.26, 1.46) : rnd(1.08, 1.2);
  const ringT = p.cluster ? 0 : clamp(p.r / maxR, 0, 1);
  const dl = (p.cluster ? rnd(0, .04) : ringT * RIPPLE_SPAN) + rnd(0, .05);
  el.style.cssText = `left:${innerWidth / 2 + p.x}px;top:${innerHeight / 2 + p.y}px;width:${p.size}px;height:${p.size}px;` +
    `z-index:${p.cluster ? 30 : Math.floor(rnd(1, 25))};--r:${r}deg;--r0:${r - rnd(18, 48)}deg;--o:${rnd(.86, 1).toFixed(2)};` +
    `--pk:${pk.toFixed(2)};--dur:${dur.toFixed(2)}s;--dl:${dl.toFixed(2)}s`;
  el.innerHTML = createWallFlower();
  wall.appendChild(el);
  void el.offsetWidth;
  el.classList.add('in');
}

function startBloom() { planFlowers(); spawned = 0; }
function updateBloom(T) {
  const target = Math.min(total, Math.max(7, Math.round(total * bloomFraction(T))));
  while (spawned < target) spawnFlower(spawned++);
}

/* =====================================================
   STAGE 2 — REVEAL (each step is a timeline cue)
   ===================================================== */
const transitionToReveal = () => { wall.classList.add('out'); $('bg').classList.add('on'); };
const showBotany  = () => $('botany').classList.add('on');
const showPostcard = () => { $('card').classList.add('on'); };
const showFigures = () => {
  ['fig-left', 'fig-right'].forEach((id, i) => setTimeout(() => $(id).classList.add('on'), i * 250));
  createCelebrationBurst('confetti-left-top', { count: 13, spread: 82, palette: ['#f2b8bf','#f7d9a0','#b7c5e5','#f9d77b','#d6b9dc','#ffabc5','#f8c2d1'] });
  createCelebrationBurst('confetti-right-top', { count: 13, spread: 82, palette: ['#f2b8bf','#f7d9a0','#b7c5e5','#f9d77b','#d6b9dc','#ffabc5','#f8c2d1'] });
  createCelebrationBurst('confetti-center', { count: 28, spread: 130, palette: ['#f2b8bf','#f7d9a0','#b7c5e5','#a8d4b5','#d6b9dc','#f9d77b','#e7a7a7','#ff9eb3','#ffd8a8'] });
};
const animateMessage = () => $('card').classList.add('write');

const CUES = [
  { t: 1.55, run: transitionToReveal },
  { t: 2.1,  run: showBotany },
  { t: 3.1,  run: showPostcard },
  { t: 3.6,  run: showFigures },
  { t: 4.0,  run: animateMessage }
];

/* =====================================================
   MASTER CLOCK & INTERACTION
   ===================================================== */
let T = 0, last = 0, cueIdx = 0, raf = 0, lastTap = 0;
function tick(now) {
  T += Math.min((now - last) / 1000, .1); last = now;
  if (T < BLOOM_END) updateBloom(T);
  while (cueIdx < CUES.length && T >= CUES[cueIdx].t) CUES[cueIdx++].run();
  if (cueIdx < CUES.length) raf = requestAnimationFrame(tick);
}

// Any interaction nudges the current step forward — never restarts.
function advance() {
  const now = performance.now();
  if (now - lastTap < 350 || cueIdx >= CUES.length) return;
  lastTap = now;
  if (cueIdx === 0) T = Math.max(T + .6, .5);           // stage 1: speed the bloom
  else T = Math.max(T, CUES[cueIdx].t);                 // stage 2: jump to next reveal step
}
addEventListener('pointerdown', advance);
addEventListener('keydown', e => { if (e.code === 'Space' || e.key === 'Enter') { e.preventDefault(); advance(); } });
addEventListener('wheel', e => { e.preventDefault(); advance(); }, { passive: false });
addEventListener('touchmove', e => { e.preventDefault(); advance(); }, { passive: false });

/* =====================================================
   RESET
   ===================================================== */
function resetExperience() {
  cancelAnimationFrame(raf);
  wall.innerHTML = ''; wall.className = 'layer';
  ['bg', 'botany', 'fig-left', 'fig-right'].forEach(id => $(id).classList.remove('on'));
  $('card').classList.remove('on', 'write');
  T = 0; cueIdx = 0; spawned = 0;
  document.body.offsetWidth;
  createPostcard();
  startBloom();
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce) { CUES.forEach(c => c.run()); cueIdx = CUES.length; return; }
  updateBloom(0);
  last = performance.now();
  raf = requestAnimationFrame(tick);
}

/* =====================================================
   INIT
   ===================================================== */
createBotany(); 
resetExperience();
</script>
</body>
</html>
